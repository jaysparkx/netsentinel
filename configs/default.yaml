seed: 42

paths:
  raw_dir: data/raw
  artifacts_dir: artifacts
  reports_dir: reports

data:
  validation_size: 0.2
  # full = all 40 features, live = 28 features we can compute from packet headers
  feature_profiles: [full, live]

supervised:
  candidates: [random_forest, hist_gradient_boosting, logistic_regression, mlp]
  selection_metric: f1_macro

anomaly:
  candidates: [isolation_forest, autoencoder]
  # threshold = this percentile of anomaly scores on normal validation data
  threshold_percentile: 99.0

evaluation:
  test_sets: [KDDTest+, KDDTest-21]
  permutation_importance_samples: 3000

cicids:
  normal_train_samples: 250000
  attack_cap_per_type: 50000
  random_test_size: 0.3
