[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsentinel"
version = "1.0.0"
description = "Hybrid ML-based Network Intrusion & Anomaly Detection System (NSL-KDD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "tabulate>=0.9",
]

[project.optional-dependencies]
live = ["scapy>=2.5"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dashboard = ["streamlit>=1.30", "plotly>=5.0"]
dev = ["pytest>=7.0"]

[project.scripts]
netsentinel = "netsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"netsentinel.web" = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
